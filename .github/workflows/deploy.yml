name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: python-api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/react-api:latest
            ghcr.io/${{ github.repository_owner }}/react-api:${{ github.event.workflow_run.head_sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: my-react-application
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/react-web:latest
            ghcr.io/${{ github.repository_owner }}/react-web:${{ github.event.workflow_run.head_sha }}
