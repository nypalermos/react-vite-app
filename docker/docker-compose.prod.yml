services:
  mongodb:
    image: mongo:8
    container_name: mongodb-prod
    restart: unless-stopped
    volumes:
      - mongodb-prod-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    image: ${API_IMAGE:?Set API_IMAGE in docker/.env}
    container_name: react-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      APP_MODE: simple
      MONGODB_URI: mongodb://mongodb:27017

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE in docker/.env}
    container_name: react-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mongodb-prod-data:
