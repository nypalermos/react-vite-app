services:
  mongodb:
    image: mongo:8
    container_name: mongodb-prod
    restart: unless-stopped
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME in docker/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD in docker/.env}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME in docker/.env}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in docker/.env}
      MONGO_APP_DATABASE: ${MONGO_APP_DATABASE:-react_vite_app}
    volumes:
      - mongodb-prod-data:/data/db
      - ./mongo-init-prod:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u",
          "${MONGO_ROOT_USERNAME}",
          "-p",
          "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    # MongoDB is only reachable on the Compose network (not published to the host).

  api:
    image: ${API_IMAGE:?Set API_IMAGE in docker/.env}
    container_name: react-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      APP_MODE: simple
      MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in docker/.env}
      MONGODB_DATABASE: ${MONGO_APP_DATABASE:-react_vite_app}

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE in docker/.env}
    container_name: react-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mongodb-prod-data:
